name: tests

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    # The exporter's type handling depends on what psycopg2 returns for a
    # bytea, a jsonb, an interval — a property of the driver, not of our code.
    # Only a real Postgres can tell you, so CI gets one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:test@localhost:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (incl. dev)
        run: uv sync --group dev

      # Lint, format and type checks run in the pre-commit workflow, from the
      # same hook definitions developers get locally. Duplicating them here
      # would let the two drift.
      - name: Run tests (pytest)
        run: uv run pytest --junitxml=test-output.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-output.xml
