[project]
name = "de-template"
version = "0.1.0"
description = "General-purpose data engineering project template"
requires-python = ">=3.12"

# ── Core runtime dependencies ──────────────────────────────────────────────
dependencies = [
    "apache-airflow>=3.2.2",
    # Both pins matter: dbt-postgres<1.10.0 keeps the classic (pre-"Fusion")
    # adapter package, but its own metadata does not pin dbt-core tightly
    # enough to stop a resolver picking the "Fusion" 2.x line on its own — so
    # dbt-core is pinned explicitly too. dbt-core 2.x has no Postgres adapter
    # at all as of this writing; either pin missing silently breaks every
    # `dbt` command in this template. Unlike POSTGRES_VERSION/AIRFLOW_VERSION
    # in .env, this isn't made into a knob — there is nothing to upgrade to
    # yet. See docs/operations.md "Upgrading the pinned versions" for when
    # (and how) to revisit it.
    "dbt-core>=1.8.0,<2.0.0",
    "dbt-postgres>=1.8.0,<1.10.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    # Parquet export. The floor matches ds-template so a file written here
    # is readable there without a version negotiation.
    "pyarrow>=23.0.1",
    "tenacity>=8.3.0",
    "structlog>=24.0.0",
    # Reads and writes the .xlsx workbooks the SharePoint extractor pulls in.
    "openpyxl>=3.1.0",
]

# ── Optional dependency groups ─────────────────────────────────────────────
# PEP 735 groups, installed with `uv sync --group <name>`.
[dependency-groups]

dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    # The hand-off is only real if pandas can read the file, so the tests that
    # assert that need pandas. Same floor as ds-template, which is the
    # reader those tests stand in for.
    "pandas>=2.2.0",
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "pre-commit>=3.7.0",
    "bandit>=1.9.3",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0",
]

# Ad-hoc exploration against the warehouse. Activate with:
#   uv sync --group notebooks
#
# Modelling lives in ds-template, not here. This template stops at the
# marts layer and hands off through exporters/; see docs/handoff.md.
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "extractors", "loaders", "exporters"]

# ── Tool configuration ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F/I/UP/B is this template's own baseline; D matches ds-template, so
# code reads the same way in both repositories.
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["E203", "E266", "E501", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names.
"tests/**" = ["D103"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests lean on unittest.mock; strict typing there costs more than it catches.
module = "tests.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=core --cov=extractors --cov=loaders --cov=exporters --cov-report=term-missing"
