x-airflow-common: &airflow-common
  build:
    # Context is the repo root so the Dockerfile can COPY requirements-airflow.txt
    # (which lives at the root, kept in sync with pyproject.toml).
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      # Falls back to the Dockerfile's own ARG default when unset — override
      # by setting AIRFLOW_VERSION in .env, not by editing this file or the
      # Dockerfile. See docs/operations.md "Upgrading the pinned versions".
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.1}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow_db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # ── Auth (Airflow 3 SimpleAuthManager) ──────────────────────────────────
    # Airflow 3 removed the FAB-based `airflow users` CLI from core. The default
    # SimpleAuthManager reads users as `username:role` pairs and stores their
    # passwords in a JSON file. We pin that file (mounted below, pre-seeded with
    # admin/admin) so the login is stable instead of a random password in logs.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json

    # ── Secrets (development only — change for any shared/production use) ─────
    # Empty Fernet key disables connection/variable encryption. Generate one with:
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AIRFLOW__CORE__FERNET_KEY: ""
    # Shared JWT secret so LocalExecutor tasks (run by the scheduler) can
    # authenticate to the api-server's execution API. Must match across services.
    AIRFLOW__API_AUTH__JWT_SECRET: "dev-jwt-secret-change-me"
    AIRFLOW__API__SECRET_KEY: "dev-secret-key-change-me"

    _PIP_ADDITIONAL_REQUIREMENTS: ""
    # Override .env for container networking — inside Docker, postgres is the service hostname
    POSTGRES_HOST: postgres

    # The project packages are bind-mounted under /opt/airflow rather than
    # pip-installed, so that directory has to be importable. Airflow only puts
    # dags/, plugins/, and config/ on sys.path by itself.
    PYTHONPATH: /opt/airflow
    # Pin the root explicitly so core.config resolves cfg/ and data/ from the
    # mount point rather than inferring it from the package's depth on disk.
    DE_PROJECT_ROOT: /opt/airflow
    # Written to by the export task; matches the data/exports mount below.
    HANDOFF_DESTINATION_DIR: /opt/airflow/data/exports
  volumes:
    - ./dags:/opt/airflow/dags
    - ./core:/opt/airflow/core
    - ./extractors:/opt/airflow/extractors
    - ./loaders:/opt/airflow/loaders
    - ./exporters:/opt/airflow/exporters
    - ./cfg:/opt/airflow/cfg
    - ./dbt:/opt/airflow/dbt
    # Where the export task writes. To have Airflow write straight into a
    # downstream project instead, point this at its input directory and set
    # HANDOFF_DESTINATION_DIR to /opt/airflow/data/exports in .env — e.g. for
    # ds-template, the reference example:
    #   - /Users/you/code/ds-template/data/raw:/opt/airflow/data/exports
    - ./data/exports:/opt/airflow/data/exports
    - ./docker/airflow/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  env_file:
    - .env

services:

  postgres:
    # Override by setting POSTGRES_VERSION in .env — see docs/operations.md
    # "Upgrading the pinned versions". A major-version bump is not just a tag
    # change if postgres_data already has data in it: Postgres's on-disk
    # format is not compatible across majors. `make reset` (fresh volume) is
    # the easy path for local dev; a shared/production instance needs a real
    # pg_upgrade or dump/restore.
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-de_user}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-de_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s

  # api-server + scheduler + dag-processor + triggerer, one process tree.
  # `airflow standalone` is Airflow's own local-dev mode — see
  # docs/operations.md "The services" for why this is safe here specifically
  # (forces LocalExecutor and SimpleAuthManager, both already set below;
  # initialises the metadata DB on every start, idempotently, replacing the
  # separate one-shot init step).
  airflow:
    <<: *airflow-common
    command: standalone
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
