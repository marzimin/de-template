version: 2

# Marts are the only layer read from outside dbt, so this file is a contract,
# not just documentation. Anything exported to ds-template is described
# here, and the tests below are what stop a broken mart reaching a model.
#
# Mirror these column constraints as Pandera checks in that project's
# FEATURE_COLUMNS and the same violation fails from both sides — here when dbt
# builds the table, there when the file is read. See docs/handoff.md.

models:
  - name: example_items
    description: >
      Starter mart used to verify dbt tests in a fresh clone. Exported to
      example_items.csv for ds-template — see `exports:` in
      cfg/config.yaml.
    columns:
      - name: item_id
        description: Natural key. One row per item.
        tests:
          - not_null
          - unique
      - name: item_name
        description: Cleaned display name.
        tests:
          - not_null
      - name: item_name_length
        description: >
          Character count of item_name. Stands in for a real feature; a model
          downstream would train on columns like this one.
        tests:
          - not_null

  - name: local_sales_by_category
    description: >
      Monthly sales totals per category, from the local demo data
      (data/sample_source/, see docs/pipelines.md "Local dummy data"). Joins
      the incremental monthly_sales fact to the seed categories dimension in
      int_local_monthly_sales_enriched, then aggregates here — the worked
      example of the staging → intermediate → marts shape end to end.
    columns:
      - name: category_id
        description: >
          NULL if a sale's category text didn't match any row in
          seed_categories.xlsx — a real join-quality signal, not a bug to
          silently coalesce away.
      - name: category
        tests:
          - not_null
      - name: sale_month
        tests:
          - not_null
      - name: num_sales
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: local_customers
    description: >
      Pass-through of the local demo `customers.xlsx` snapshot — the simplest
      possible mart, one row per customer, no joins. Contrast with
      local_sales_by_category above for the two shapes a mart takes: a
      dimension table like this one, and an aggregated fact table.
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_name
        tests:
          - not_null
