# =============================================================================
# Project configuration. Everything the pipeline needs to know about your
# warehouse, your sources, and where processed data is handed off lives here —
# you should not need to edit Python to change any of it.
#
# Secrets do not belong here. Passwords and API keys go in `.env`, which is
# never committed. This file is.
# =============================================================================

# -----------------------------------------------------------------------------
# Warehouse layout
# -----------------------------------------------------------------------------
# These schema names must match three things: the schemas created by
# docker/postgres/init.sh, the `+schema:` settings in dbt/dbt_project.yml, and
# the `sources:` targets below. Change one and you must change all three.
warehouse:
  raw_schema: raw
  staging_schema: staging
  marts_schema: marts

# -----------------------------------------------------------------------------
# dbt
# -----------------------------------------------------------------------------
# Local paths are relative to the repository root. `container_dir` is where
# docker-compose mounts dbt/ inside the Airflow containers — DAG tasks use that
# one, `make dbt-run` uses the local pair.
dbt:
  project_dir: dbt
  profiles_dir: dbt
  container_dir: /opt/airflow/dbt

# -----------------------------------------------------------------------------
# Local dummy data
# -----------------------------------------------------------------------------
# Where `make local-seed` writes its files, and where the `local_*` sources
# below read them back from. Not a secret, so it lives here rather than in
# `.env`. See docs/pipelines.md ("Local dummy data") for when to reach for
# this and what it does and does not prove about a real source.
local_dummy_data:
  destination: "data/sample_source"
  folder_path: "Sample Data"

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------
# One entry per upstream system. `extractor` is an import path in
# `module:ClassName` form, resolved at run time, so adding a source means adding
# a class and a line here — no DAG edit and no import to wire up.
#
# `target_table` is where the loader writes the untouched records. Keep these in
# the raw schema; cleaning belongs in dbt, not in the loader.
#
# `load_mode` decides what happens to rows already in the table:
#   append   (default) add to what is there. Right for a growing log you fetch
#            incrementally — but running a pipeline twice loads the data twice,
#            so deduplicate in the staging model.
#   replace  empty the table first. Right for a small source you re-fetch in
#            full every run. An empty extract is always a no-op, so a failed
#            API call cannot wipe the table.
sources:
  example_items:
    extractor: "extractors.api.example_api:ExampleApiExtractor"
    target_table: "raw.example_items"
    load_mode: "append"

  # data/sample_source/ (populated by `make local-seed`) holds several kinds
  # of workbook at once — see the module docstring in
  # extractors/files/local_excel.py for why each kind gets its own extractor
  # class and its own load_mode below.
  #
  # These four are the shipped demo — replace them with your own once you
  # have real data. The generator is scripts/demo_dataset.py (see its
  # docstring for the full checklist: define your data there, add a matching
  # extractor class, then a source entry here, same shape as these four). Or
  # delete this block and extractors/files/ entirely and follow
  # extractors/api/example_api.py's pattern instead, if a REST API rather
  # than a folder of files is what you actually have.
  local_seed_data:
    extractor: "extractors.files.local_excel:LocalSeedExtractor"
    target_table: "raw.local_seed_data"
    load_mode: "replace"

  local_latest_orders:
    extractor: "extractors.files.local_excel:LocalLatestOrdersExtractor"
    target_table: "raw.local_latest_orders"
    load_mode: "replace"

  local_customers:
    extractor: "extractors.files.local_excel:LocalCustomersExtractor"
    target_table: "raw.local_customers"
    load_mode: "replace"

  local_monthly_sales:
    extractor: "extractors.files.local_excel:LocalMonthlySalesExtractor"
    target_table: "raw.local_monthly_sales"
    load_mode: "append"

# -----------------------------------------------------------------------------
# Hand-off downstream
# -----------------------------------------------------------------------------
# Marts exported to files for whatever reads them next — a modelling project,
# a BI tool, anything. This is the seam: this project owns everything up to
# and including `marts`; a downstream project owns everything after the file.
# The reference example built and tested against is ds-template, referenced
# below as a concrete illustration — nothing here requires it specifically.
#
#   destination — where the files are written. Relative paths resolve from this
#                 repository root. Set HANDOFF_DESTINATION_DIR in .env to point
#                 straight at your downstream project's input directory
#                 instead (e.g. ds-template's data/raw/), which is the usual
#                 setup when both repositories are checked out side by side.
#   format      — "csv" or "parquet". Use csv unless you have a reason not to:
#                 ds-template reads csv out of the box, and parquet needs
#                 its cfg/config.yaml pointed at the file explicitly.
#   null_sentinel — what a SQL NULL becomes in CSV. Empty is what pandas reads
#                 as NaN with no extra configuration, so it is the default. The
#                 cost is that a genuine empty string looks identical to NULL;
#                 set something like "\\N" if you need to tell them apart, and
#                 pass na_values on the reading side to match.
#   datasets    — one entry per file. `relation` is the mart to read,
#                 `file_name` is what to call it on disk. In the ds-template
#                 example, the file name is then set as `data.input_file`
#                 over there.
exports:
  destination: "data/exports"
  format: "csv"
  null_sentinel: ""
  datasets:
    - relation: "marts.example_items"
      file_name: "example_items.csv"
